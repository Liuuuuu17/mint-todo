<h2>Mint Todo 2.5.2</h2>
<ul>
<li>编辑计划中新增“导入 JSON 更新当前目标”：粘贴或选择外部 AI 修改后的完整计划，预览新增和移除任务，应用到草稿后继续编辑，保存时更新原目标。</li>
<li>按任务 ID 或唯一同名任务匹配并保留完成记录、成果和待办关联；改名且没有原 ID 的任务会按新增处理，请在预览中确认。</li>
<li>阶段和任务列表新增三个点菜单，可直接加入待办或今日待办；阶段支持确认后批量加入未开始、进行中且尚未关联的任务。</li>
</ul>
<p>176 项正式版检查通过。支持 macOS 13+、Apple Silicon 和 Intel。已有任务和设置保留。</p>
